name: Auto Update AI Data

on:
  schedule:
    # 每天北京时间早上 8 点执行
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      data_type:
        description: '要更新的数据类型 (all/news/tools/updates)'
        required: false
        default: 'all'

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Run data collection scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.data_type }}" = "all" ] || [ -z "${{ github.event.inputs.data_type }}" ]; then
            echo "Updating all data..."
            node scripts/collect-news.js
            node scripts/collect-updates.js
            node scripts/collect-tools.js
          elif [ "${{ github.event.inputs.data_type }}" = "news" ]; then
            echo "Updating news only..."
            node scripts/collect-news.js
          elif [ "${{ github.event.inputs.data_type }}" = "updates" ]; then
            echo "Updating updates only..."
            node scripts/collect-updates.js
          elif [ "${{ github.event.inputs.data_type }}" = "tools" ]; then
            echo "Updating tools only..."
            node scripts/collect-tools.js
          fi

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet; then
            echo "No changes detected"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "Changes detected"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push changes
        if: steps.check-changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/
          git commit -m "chore: auto-update data $(date +%Y-%m-%d)"
          git push
