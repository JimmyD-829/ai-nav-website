name: Auto Update AI Data

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - master

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: |
          node scripts/collect-news.mjs
          node scripts/collect-updates.mjs
          node scripts/collect-tools.mjs
          node scripts/collect-showcase.mjs
      - run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add src/data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update data $(date +%Y-%m-%d)" && git push)
